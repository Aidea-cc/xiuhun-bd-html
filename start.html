<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>西顿BD原型</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            text-align: center;
        }
        .page-list {
            display: grid;
            gap: 15px;
        }
        .page-item {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .page-item:hover {
            background: #e9ecef;
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .page-item a {
            text-decoration: none;
            color: #333;
            font-size: 18px;
            font-weight: 500;
            display: block;
        }
        .page-item span {
            display: block;
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 西顿BD原型 - 页面导航</h1>
        <div class="page-list">
            <div class="page-item">
                <a href="1_首页.html">🏠 首页</a>
                <span>应用主页面，包含主要功能入口</span>
            </div>
            <div class="page-item">
                <a href="2_促单.html">📝 促单</a>
                <span>订单促进功能页面</span>
            </div>
            <div class="page-item">
                <a href="3_订单列表.html">📋 订单列表</a>
                <span>查看和管理订单</span>
            </div>
            <div class="page-item">
                <a href="4_服务网点.html">📍 服务网点</a>
                <span>查看服务网点信息</span>
            </div>
            <div class="page-item">
                <a href="5_我的.html">👤 我的</a>
                <span>个人中心</span>
            </div>
            <div class="page-item">
                <a href="0_首次登录页.html">🎯 首次登录页</a>
                <span>新用户首次登录引导</span>
            </div>
            <div class="page-item">
                <a href="登录_注册_重置密码.html">🔐 登录/注册/重置密码</a>
                <span>用户认证相关页面</span>
            </div>
            <div class="page-item">
                <a href="原型：主功能页面.html">⚙️ 原型：主功能页面</a>
                <span>完整功能原型</span>
            </div>
            <div class="page-item">
                <a href="全局组件_顶部_左侧_连接蓝牙设备_虚拟电话等_.html">🧩 全局组件</a>
                <span>全局UI组件展示</span>
            </div>
        </div>
    </div>
</body>
</html>
